# Render Blueprint for Aemerg, on the free plan.
#
# There is no disk here on purpose. Disks are a paid feature, and asking for
# one is what makes Render ask for a card. Instead the store lives in a hosted
# key-value service (Upstash has a free tier that needs no card), which is what
# lets accounts and queued notes survive a restart on a free instance.
#
# The env vars below are marked sync:false, so Render prompts for them rather
# than keeping them in this file. See the README for where each one comes from.
#
# What the free plan costs you: the service sleeps after 15 minutes idle, so
# the first visit after a quiet spell takes about a minute to wake. Nothing is
# lost while it sleeps. Notes queue, and a note sent to a sleeping friend still
# reaches their phone, because the sender's own request wakes the server first.

services:
  - type: web
    name: aemerg
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit

    envVars:
      - key: NODE_VERSION
        value: "22"

      # the store. Upstash > your database > REST API
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # push. From vapid.json, or `npm run keys`
      - key: VAPID_SUBJECT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
